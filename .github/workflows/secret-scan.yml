# 秘密情報の点検と、文書のリンク切れの点検。
# ローカルの .githooks/pre-commit を有効にし忘れても、プッシュのたびに GitHub 側で同じ点検をする。
# Ubuntu で数秒で終わる軽い点検だけにしている（macOS の実行時間を使わない）。
name: 点検

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: 秘密情報の点検
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: API キーらしい文字列が無いか（全履歴）
        run: |
          # 見つかった文字列そのものはログに出さない（ログに鍵の写しを残さないため）。
          # どのコミットかだけを出す。
          if git log -p --all | grep -qE 'sk-ant-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{35}'; then
            echo "::error::API キーらしい文字列が履歴に見つかりました（中身は表示しません）。"
            git log --all --format='%h %s' -G 'sk-ant-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{35}'
            exit 1
          fi
          echo "見つかりませんでした。"

      - name: secrets/ と private-data/ が入っていないか
        run: |
          if git ls-files | grep -E '^(secrets|private-data)/'; then
            echo "::error::secrets/ か private-data/ のファイルがコミットされています。"
            exit 1
          fi
          echo "入っていません。"

  doc-links:
    name: 文書のリンク切れの点検
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown の相対リンク先が実在するか
        run: python3 .github/scripts/check_links.py
